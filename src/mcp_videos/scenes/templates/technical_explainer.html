<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --time-ms: 0;
    --accent: {{ACCENT}};
    --scene-progress: 0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070d;
    color: #eaf6ff;
    font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
  }
  body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    min-width: {{WIDTH}}px;
    min-height: {{HEIGHT}}px;
  }
  body.theme-dark {
    --bg: #05070d;
    --panel: rgba(11, 18, 32, 0.88);
    --panel-strong: #0b1220;
    --text: #eaf6ff;
    --muted: #8aa0b8;
    --line: rgba(103, 232, 249, 0.2);
    --grid: rgba(148, 190, 220, 0.08);
    --active-glow: rgba(103, 232, 249, 0.55);
  }
  body.theme-light {
    --bg: #eef4fb;
    --panel: rgba(255, 255, 255, 0.92);
    --panel-strong: #ffffff;
    --text: #0b172a;
    --muted: #51657c;
    --line: rgba(14, 116, 144, 0.22);
    --grid: rgba(15, 55, 90, 0.08);
    --active-glow: rgba(14, 116, 144, 0.4);
  }
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 60px 60px 46px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow: hidden;
    background:
      radial-gradient(circle at 82% 6%, rgba(103, 232, 249, 0.16), transparent 30%),
      radial-gradient(circle at 12% 92%, rgba(234, 179, 8, 0.1), transparent 28%),
      var(--bg);
    color: var(--text);
  }
  .blueprint-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(circle at 50% 42%, black 20%, transparent 78%);
    pointer-events: none;
  }
  header {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 32px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 18px;
    color: var(--accent);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .eyebrow::before {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 18px var(--active-glow);
  }
  h1 {
    margin: 0;
    max-width: 860px;
    font-size: 68px;
    line-height: 1.02;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .subtitle {
    margin: 16px 0 0;
    max-width: 820px;
    color: var(--muted);
    font-size: 28px;
    line-height: 1.32;
  }
  .badge {
    flex: none;
    padding: 14px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--muted);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.12em;
    white-space: nowrap;
  }
  main {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .diagram-card {
    position: relative;
    flex: 1 1 auto;
    min-height: 480px;
    border: 1px solid var(--line);
    border-radius: 34px;
    overflow: hidden;
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.045), transparent 42%),
      var(--panel);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .diagram-card svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .scanline {
    position: absolute;
    inset: -20% 0 auto;
    height: 18%;
    background: linear-gradient(180deg, transparent, rgba(103, 232, 249, 0.09), transparent);
    transform: translateY(0%);
    pointer-events: none;
  }
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }
  .metric-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 128px;
    padding: 22px 24px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--panel);
  }
  .metric-label {
    color: var(--muted);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .metric-value {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .metric-number {
    font-size: 50px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
  }
  .metric-unit {
    color: var(--accent);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .caption-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 164px;
    padding: 22px 30px 26px;
    border: 1px solid var(--line);
    border-radius: 26px;
    background: linear-gradient(120deg, rgba(103, 232, 249, 0.08), transparent 55%), var(--panel);
  }
  .caption-kicker {
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.22em;
  }
  .caption-words {
    margin: 0;
    font-size: 36px;
    font-weight: 650;
    line-height: 1.24;
    letter-spacing: -0.015em;
  }
  .caption-words .word {
    opacity: 0.36;
  }
  .caption-words .word.is-spoken {
    opacity: 0.68;
  }
  .caption-words .word.is-active {
    opacity: 1;
    color: var(--accent);
    text-shadow: 0 0 28px var(--active-glow);
  }
  footer {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(148, 190, 220, 0.16);
  }
  .progress-bar {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), rgba(255, 255, 255, 0.82));
  }
  .timeline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.12em;
  }
</style>
</head>
<body class="theme-{{THEME}}">
  <main class="scene" id="scene-root" data-start-ms="{{START_MS}}" data-duration-ms="{{DURATION_MS}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
    <div class="blueprint-grid"></div>
    <header>
      <div>
        <p class="eyebrow">{{EYEBROW}}</p>
        <h1>{{TITLE}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
      </div>
      <div class="badge">60 FPS · SVG</div>
    </header>
    <main>
      <section class="diagram-card" aria-label="Diagrama técnico animado">
        <svg id="technical-diagram" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Antena parabólica con telemetría">
          <defs>
            <linearGradient id="dishGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="{{ACCENT}}" stop-opacity="0.82"></stop>
              <stop offset="100%" stop-color="{{ACCENT}}" stop-opacity="0.06"></stop>
            </linearGradient>
            <radialGradient id="halo" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="{{ACCENT}}" stop-opacity="0.22"></stop>
              <stop offset="100%" stop-color="{{ACCENT}}" stop-opacity="0"></stop>
            </radialGradient>
            <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
              <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
              </feMerge>
            </filter>
          </defs>
          <circle cx="450" cy="320" r="290" fill="url(#halo)"></circle>
          <ellipse cx="450" cy="448" rx="338" ry="86" fill="none" stroke="{{ACCENT}}" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="10 14"></ellipse>
          <ellipse cx="450" cy="448" rx="242" ry="54" fill="none" stroke="{{ACCENT}}" stroke-opacity="0.12" stroke-width="2"></ellipse>
          <g id="evolution-ghosts" stroke="{{ACCENT}}" fill="none" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="7 10">
            <path d="M 268 432 Q 450 178 632 432"></path>
            <path d="M 300 440 Q 450 210 600 440"></path>
            <path d="M 226 448 Q 450 142 674 448"></path>
          </g>
          <g id="dish-group" filter="url(#softGlow)">
            <path d="M 210 448 Q 450 122 690 448" fill="url(#dishGradient)" stroke="{{ACCENT}}" stroke-width="3"></path>
            <path d="M 210 448 Q 450 532 690 448" fill="none" stroke="{{ACCENT}}" stroke-width="2" stroke-opacity="0.55"></path>
            <line x1="450" y1="312" x2="450" y2="520" stroke="{{ACCENT}}" stroke-width="2" stroke-opacity="0.72"></line>
            <line x1="330" y1="404" x2="450" y2="312" stroke="{{ACCENT}}" stroke-width="2" stroke-opacity="0.45"></line>
            <line x1="570" y1="404" x2="450" y2="312" stroke="{{ACCENT}}" stroke-width="2" stroke-opacity="0.45"></line>
            <circle id="feed-horn" cx="450" cy="306" r="18" fill="{{ACCENT}}"></circle>
          </g>
          <g id="signal-waves" fill="none" stroke="{{ACCENT}}">
            <circle class="wave" cx="450" cy="300" r="42" stroke-width="3" stroke-opacity="0.9"></circle>
            <circle class="wave" cx="450" cy="300" r="82" stroke-width="2.6" stroke-opacity="0.7"></circle>
            <circle class="wave" cx="450" cy="300" r="126" stroke-width="2.2" stroke-opacity="0.5"></circle>
            <circle class="wave" cx="450" cy="300" r="174" stroke-width="1.8" stroke-opacity="0.32"></circle>
          </g>
          <line id="sweep-line" x1="450" y1="300" x2="450" y2="92" stroke="{{ACCENT}}" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75"></line>
          <g stroke="{{ACCENT}}" stroke-opacity="0.28" stroke-width="2">
            <line x1="70" y1="540" x2="830" y2="540"></line>
            <line x1="70" y1="530" x2="70" y2="550"></line>
            <line x1="260" y1="530" x2="260" y2="550"></line>
            <line x1="450" y1="530" x2="450" y2="550"></line>
            <line x1="640" y1="530" x2="640" y2="550"></line>
            <line x1="830" y1="530" x2="830" y2="550"></line>
          </g>
          <text x="82" y="586" fill="{{ACCENT}}" font-size="22" font-weight="700" letter-spacing="4">GANANCIA / dBi</text>
          <text id="iteration-readout" x="612" y="586" fill="{{ACCENT}}" font-size="22" font-weight="700" letter-spacing="4" text-anchor="end">GEN 0000</text>
          <text x="450" y="112" fill="{{ACCENT}}" fill-opacity="0.62" font-size="19" font-weight="700" letter-spacing="5" text-anchor="middle">ARRAY PHASED · BEAM FORMING</text>
        </svg>
        <div class="scanline" id="scanline"></div>
      </section>
      <section class="metrics-grid" id="metrics-grid" aria-label="Telemetría de la escena"></section>
      <section class="caption-card">
        <span class="caption-kicker">TRANSCRIPCIÓN SINCRONIZADA</span>
        <p class="caption-words" id="caption-words">{{CAPTION_FALLBACK}}</p>
      </section>
    </main>
    <footer>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="timeline">
        <span id="time-label">0.00 s / 0.00 s</span>
        <span>RELOJ VIRTUAL · {{DURATION_MS}} ms</span>
      </div>
    </footer>
  </main>
  <script type="application/json" id="mcp-word-cues">{{WORDS_JSON}}</script>
  <script type="application/json" id="mcp-scene-metrics">{{METRICS_JSON}}</script>
  <script data-mcp-videos-harness="1">{{HARNESS_JS}}</script>
  <script>
    (function () {
      "use strict";

      var root = document.getElementById("scene-root");
      var duration = Math.max(1, Number(root.getAttribute("data-duration-ms")) || 1);
      var wordCues = JSON.parse(document.getElementById("mcp-word-cues").textContent || "[]");
      var metricDefinitions = JSON.parse(
        document.getElementById("mcp-scene-metrics").textContent || "[]"
      );
      var caption = document.getElementById("caption-words");
      var metricsGrid = document.getElementById("metrics-grid");
      var progressBar = document.getElementById("progress-bar");
      var progressTrack = document.getElementById("progress-track");
      var timeLabel = document.getElementById("time-label");
      var scanline = document.getElementById("scanline");
      var diagram = document.getElementById("technical-diagram");
      var dishGroup = document.getElementById("dish-group");
      var ghostGroup = document.getElementById("evolution-ghosts");
      var feedHorn = document.getElementById("feed-horn");
      var sweepLine = document.getElementById("sweep-line");
      var iterationReadout = document.getElementById("iteration-readout");
      var waves = Array.prototype.slice.call(document.querySelectorAll(".wave"));
      var wordNodes = [];
      var metricNodes = [];

      function formatNumber(value, decimals) {
        var fixed = Number(value).toFixed(decimals);
        var parts = fixed.split(".");
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return parts.join(",");
      }

      function formatClock(value) {
        return (Math.max(0, value) / 1000).toFixed(2) + " s";
      }

      function pad(value, size) {
        var text = String(value);
        while (text.length < size) {
          text = "0" + text;
        }
        return text;
      }

      wordCues.forEach(function (cue, index) {
        var node = document.createElement("span");
        node.className = "word";
        node.setAttribute("data-index", String(index));
        node.setAttribute("data-start-ms", String(cue.start_ms));
        node.setAttribute("data-end-ms", String(cue.end_ms));
        node.textContent = cue.word + " ";
        caption.appendChild(node);
        wordNodes.push(node);
      });

      if (wordNodes.length > 0) {
        caption.textContent = "";
        wordNodes.forEach(function (node) {
          caption.appendChild(node);
        });
      }

      metricDefinitions.forEach(function (definition, index) {
        var card = document.createElement("article");
        card.className = "metric-card";
        var label = document.createElement("span");
        label.className = "metric-label";
        label.textContent = definition.label || "MÉTRICA";
        var valueRow = document.createElement("div");
        valueRow.className = "metric-value";
        var number = document.createElement("strong");
        number.className = "metric-number";
        number.textContent = "0";
        var unit = document.createElement("span");
        unit.className = "metric-unit";
        unit.textContent = definition.unit || "";
        valueRow.appendChild(number);
        valueRow.appendChild(unit);
        card.appendChild(label);
        card.appendChild(valueRow);
        metricsGrid.appendChild(card);
        metricNodes.push({
          node: number,
          target: Number(definition.value),
          decimals: Math.max(0, Number(definition.decimals) || 0),
          delay: 120 + index * 110,
          numeric: isFinite(Number(definition.value)),
          raw: definition.value,
        });
      });

      function renderMetrics(timeMs) {
        var kit = window.MotionKit;
        metricNodes.forEach(function (metric) {
          if (metric.numeric) {
            var local = kit.easeOutCubic(
              kit.progressInRange(timeMs, metric.delay, metric.delay + 760)
            );
            metric.node.textContent = formatNumber(metric.target * local, metric.decimals);
          } else {
            metric.node.textContent = String(metric.raw);
          }
        });
      }

      function renderWords(timeMs) {
        var activeIndex = window.MotionKit.activeWordIndexAt(timeMs, wordCues, {
          inclusiveEnd: true,
        });
        wordNodes.forEach(function (node, index) {
          var isActive = index === activeIndex;
          node.classList.toggle("is-active", isActive);
          node.classList.toggle("is-spoken", !isActive && index < activeIndex);
        });
      }

      window.onFrameTime = function (timeMs) {
        var kit = window.MotionKit;
        var time = Math.max(0, Math.min(duration, Number(timeMs) || 0));
        var rawProgress = kit.progressInRange(time, 0, duration);
        var eased = kit.easeOutCubic(rawProgress);

        dishGroup.setAttribute(
          "transform",
          "translate(0 " + (Math.sin(rawProgress * Math.PI * 2) * 5).toFixed(2) + ")"
        );
        ghostGroup.style.opacity = String(0.12 + 0.3 * eased);
        feedHorn.setAttribute("r", (16 + 5 * Math.sin(rawProgress * Math.PI * 4)).toFixed(2));
        sweepLine.setAttribute(
          "transform",
          "rotate(" + (rawProgress * 360).toFixed(2) + " 450 300)"
        );

        waves.forEach(function (wave, index) {
          var phase = (rawProgress * 1.45 + index * 0.25) % 1;
          wave.setAttribute("r", (46 + phase * 240).toFixed(2));
          wave.style.opacity = String(Math.max(0.05, 1 - phase));
        });

        iterationReadout.textContent = "GEN " + pad(Math.round(4217 * eased), 4);
        progressBar.style.width = (rawProgress * 100).toFixed(3) + "%";
        progressTrack.setAttribute("aria-valuenow", String(Math.round(rawProgress * 100)));
        timeLabel.textContent = formatClock(time) + " / " + formatClock(duration);
        scanline.style.transform = "translateY(" + (rawProgress * 100).toFixed(2) + "%)";
        diagram.setAttribute("data-progress", rawProgress.toFixed(4));
        root.style.setProperty("--scene-progress", rawProgress.toFixed(4));

        renderMetrics(time);
        renderWords(time);
      };

      window.onFrameTime(window.__currentTimeMs || 0);
    })();
  </script>
</body>
</html>
